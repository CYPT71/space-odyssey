# Site meta
title: "CYPT71 - Cosmic Engineer"
email: contact@cypride.dev
description: "Deep Space Observatory Terminal - Portfolio & Projects"

# URLs
baseurl: "/space-odyssey"

# Theme configuration (paths relative to repository root)
layouts_dir: _tech/theme/_layouts
includes_dir: _tech/theme/_includes
sass_dir: _tech/theme/assets/css
theme: jekyll-theme-space-odyssey
include:
  - "_tech/theme"
  - "_tech/theme/_layouts"
  - "_tech/theme/_includes"
  - "_tech/theme/assets"
  - "_tech/native"

# Markup
markdown: kramdown
highlighter: rouge

# Jekyll collections configuration
collections_dir: content
collections:
  pages:
    output: true
    permalink: /:path
  posts:
    output: true
    permalink: /posts/:path

# Exclude noisy build/dev files
exclude:
  - node_modules
  - vendor
  - .jekyll-cache
  - .ruby-lsp
  - .DS_Store
  - README.md
  - Gemfile
  - Gemfile.lock

# Defaults for collections (optional but explicit)
defaults:
  - scope:
      type: pages
      path: /:path
    values:
      layout: "default"
  - scope:
      type: posts
      path: /posts/:path
    values:
      layout: "default"
